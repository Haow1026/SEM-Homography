name: Stitching and GUI tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install numpy opencv-contrib-python-headless customtkinter pillow
      - name: Run algorithm and native Tk tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Run algorithm and native Tk tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Install CJK fonts for native UI previews
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Capture native workbench previews
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python tools/preview_workbench.py --output artifacts/workbench
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.python == '3.13'
        with:
          name: workbench-ui-previews
          path: artifacts/workbench/*.png
