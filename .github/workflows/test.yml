name: Alignment and blending tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install algorithm dependencies
        run: python -m pip install numpy opencv-contrib-python-headless
      - name: Run synthetic alignment and blending regressions
        run: python -m unittest discover -s tests -v
